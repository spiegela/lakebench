[suite]
queries_file = "queries.sql"
output_dir = "results/local"
profiling_mode = "json"
warm_runs = 3
cold_runs = 2

setup_sql = [
  "SET parquet_metadata_cache=true",
  "LOAD httpfs",
  "LOAD iceberg",
  "CREATE OR REPLACE MACRO toDateTime(t) AS CASE WHEN starts_with(typeof(t), 'TIMESTAMP') THEN CAST(t AS TIMESTAMP) ELSE epoch_ms(CAST(t AS BIGINT) * 1000) END",
]

[suite.s3]
access_key_id = "replace-me"
secret_access_key = "replace-me"
region = "us-east-1"
# session_token = "replace-me"
# endpoint = "http://localhost:9000"
# url_style = "path"
# use_ssl = false

[[engines]]
name = "duckdb"
backend = "duckdb"
binary = "duckdb"
database = ":memory:"
table_name = "hits"
env = { SAMPLE_ENGINE_ENV = "replace-me" }

# ── Sirius (cold): GPU path, no preload ──────────────────────────────────────
# Binary path relative to runner.toml location.  On BSC, copy to node-local
# tmp first and point binary there to avoid GPFS hangs.
