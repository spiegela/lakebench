#  "CALL gpu_buffer_init('0.5 GB', '6 GB')",
#  "LOAD sirius",
#]

# ── Sirius (hot): GPU path with preload to warm the buffer manager ────────────
# preload_sql runs after the table view is created and before the measured
# warm-run loop.  First pass loads data into the GPU cache; subsequent queries
# in the same process find it warm.
# No explicit pin_table primitive exists in Sirius; the buffer manager retains
# data in GPU memory for the lifetime of the process automatically.
#[[engines]]
#name = "sirius-hot"
#backend = "duckdb"
#query_execution_mode = "gpu-execution"
#binary = "../../../sirius/build/release/duckdb/bin/sirius-duckdb"
#database = ":memory:"
#table_name = "hits"
#setup_sql = [
#  "CALL gpu_buffer_init('0.5 GB', '6 GB')",
#  "LOAD sirius",
#  # Materialise into a real table so the buffer manager can cache it:
#  "CREATE TABLE hits_mat AS SELECT * FROM hits",
#  "CREATE OR REPLACE VIEW hits AS SELECT * FROM hits_mat",
#]
#preload_sql = [
#  # Warming query: touches real columns from the most common query patterns.
#  # Wrap in gpu_execution so the GPU buffer manager actually loads the data.
#  """CALL gpu_execution('SELECT count(*), min(EventTime), max(EventTime),
#       min(EventDate), max(EventDate),
#       min(CounterID), max(CounterID),
#       min(UserID), max(UserID)
#     FROM hits')""",
#]

[[engines]]
name = "polars-cpu"
backend = "polars"
binary = "python3"
args = ["-u"]
table_name = "hits"
polars_collect_engine = "auto"
env = { POLARS_VERBOSE = "1" }

# ── Polars GPU (cold): GPU engine, no preload ─────────────────────────────────
# raise_on_fail is derived from polars_collect_engine = "gpu" automatically.
#[[engines]]
#name = "polars-gpu-cold"
#backend = "polars"
#binary = "/gpfs/scratch/qbst01/lakebench/src/sirius/.pixi/envs/cuda12/bin/python"
#args = ["-u"]
#table_name = "hits"
#polars_collect_engine = "gpu"
#env = { POLARS_VERBOSE = "1" }

# ── Polars GPU (hot): one extra warmup collect before measured loop ───────────
# polars_preload = "warmup" runs one throwaway .collect(engine=gpu) before the
# measured iterations, warming the GPU page cache and cuDF allocator.
# All measured warm_runs then see a warm GPU — they are all labelled Warm.
#[[engines]]
#name = "polars-gpu-hot"
#backend = "polars"
#binary = "/gpfs/scratch/qbst01/lakebench/src/sirius/.pixi/envs/cuda12/bin/python"
#args = ["-u"]
#table_name = "hits"
#polars_collect_engine = "gpu"
#polars_preload = "warmup"
#env = { POLARS_VERBOSE = "1" }

[[datasets]]
name = "parquet-eventdate-part"
table_sql = "SELECT * REPLACE (make_date(EventDate) AS EventDate) FROM iceberg_scan('s3://qb-testing/spieg/clickbench/iceberg_eventdate_part_phy/metadata/00001-d39f0ae4-282a-46d0-972b-0541f03b08b0.metadata.json')"
polars_format = "parquet"
polars_source = "s3://qb-testing/spieg/clickbench/iceberg_eventdate_part_phy/data/**/*.parquet"
#sample = { target_bytes = "2GiB", probe_rows = 100000, overhead_multiplier = 3.0 }
#sample = { rows = 20000 }

